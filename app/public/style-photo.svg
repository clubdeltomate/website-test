<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img" aria-label="Photographic still life of a coffee cup">
  <defs>
    <linearGradient id="phWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9B79A"/>
      <stop offset="1" stop-color="#B29A78"/>
    </linearGradient>
    <linearGradient id="phTable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A6A4A"/>
      <stop offset="1" stop-color="#6E5238"/>
    </linearGradient>
    <radialGradient id="phCup" cx="0.38" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#ECE3D6"/>
      <stop offset="1" stop-color="#C6B8A5"/>
    </radialGradient>
    <filter id="phSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>
  <rect width="240" height="160" fill="url(#phWall)"/>
  <rect y="96" width="240" height="64" fill="url(#phTable)"/>
  <!-- soft window light -->
  <path d="M150 0 L240 0 L240 70 Z" fill="#FBEFD6" opacity="0.28"/>
  <!-- cast shadow -->
  <ellipse cx="120" cy="128" rx="52" ry="12" fill="#3B2A1B" opacity="0.45" filter="url(#phSoft)"/>
  <!-- saucer -->
  <ellipse cx="120" cy="124" rx="46" ry="12" fill="#E7DDCC"/>
  <ellipse cx="120" cy="122" rx="46" ry="11" fill="#F3ECDD"/>
  <!-- cup -->
  <path d="M92 96 C92 118 100 124 120 124 C140 124 148 118 148 96 Z" fill="url(#phCup)"/>
  <ellipse cx="120" cy="96" rx="28" ry="9" fill="#4A2F1C"/>
  <ellipse cx="120" cy="95" rx="28" ry="8.4" fill="#6B4326"/>
  <ellipse cx="114" cy="93" rx="12" ry="3.4" fill="#8A5A34" opacity="0.7"/>
  <!-- handle -->
  <path d="M148 100 c16 -2 16 20 0 20" fill="none" stroke="#EDE4D4" stroke-width="6" stroke-linecap="round"/>
  <!-- steam -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.5" filter="url(#phSoft)">
    <path d="M112 86 c-6 -8 6 -12 0 -22"/>
    <path d="M126 86 c6 -8 -6 -12 0 -22"/>
  </g>
</svg>
