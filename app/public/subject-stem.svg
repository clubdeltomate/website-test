<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img" aria-label="Sketch of a flask, a formula and a plotted curve">
  <rect width="240" height="160" fill="#EFE6D0"/>
  <!-- graph paper, the squared kind -->
  <g stroke="#D9CBAA" stroke-width="1" opacity="0.5">
    <line x1="40" y1="0" x2="40" y2="160"/><line x1="80" y1="0" x2="80" y2="160"/>
    <line x1="120" y1="0" x2="120" y2="160"/><line x1="160" y1="0" x2="160" y2="160"/>
    <line x1="200" y1="0" x2="200" y2="160"/>
    <line x1="0" y1="40" x2="240" y2="40"/><line x1="0" y1="80" x2="240" y2="80"/>
    <line x1="0" y1="120" x2="240" y2="120"/>
  </g>

  <g fill="none" stroke="#2E2820" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- conical flask, half filled -->
    <path d="M46 34 L46 62 L28 112 A6 6 0 0 0 34 120 L82 120 A6 6 0 0 0 88 112 L70 62 L70 34"/>
    <path d="M41 34 L75 34"/>
    <path d="M35 96 L81 96 L88 112 A6 6 0 0 1 82 120 L34 120 A6 6 0 0 1 28 112 Z" fill="#4C9A5C" opacity="0.45" stroke="none"/>
    <path d="M35 96 L81 96" stroke-width="2.2"/>
    <circle cx="52" cy="106" r="3" stroke-width="1.8"/>
    <circle cx="66" cy="110" r="2.2" stroke-width="1.8"/>

    <!-- plotted curve with axes -->
    <path d="M120 116 L120 44" stroke-width="2.2"/>
    <path d="M120 116 L206 116" stroke-width="2.2"/>
    <path d="M124 110 C144 108 152 74 168 66 C182 59 192 54 202 50" stroke="#3F74D6" stroke-width="3"/>
    <circle cx="152" cy="88" r="3.4" fill="#3F74D6" stroke="none"/>
    <circle cx="182" cy="59" r="3.4" fill="#3F74D6" stroke="none"/>
  </g>

  <!-- a formula, scribbled above the plot -->
  <text x="126" y="34" font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="21" fill="#2E2820">E=mc²</text>
</svg>
