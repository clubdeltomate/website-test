<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img" aria-label="Watercolor rolling hills at sunrise">
  <defs>
    <linearGradient id="wcSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE6C7"/>
      <stop offset="1" stop-color="#F3D8E0"/>
    </linearGradient>
    <filter id="wcBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>
  <rect width="240" height="160" fill="url(#wcSky)"/>
  <!-- soft sun -->
  <circle cx="176" cy="52" r="26" fill="#F6B24B" opacity="0.55" filter="url(#wcBlur)"/>
  <circle cx="176" cy="52" r="16" fill="#F49A3E" opacity="0.5" filter="url(#wcBlur)"/>
  <!-- washed hills, translucent layers -->
  <g filter="url(#wcBlur)">
    <path d="M0 112 C60 92 110 118 160 100 C200 86 230 104 240 98 L240 160 L0 160 Z" fill="#8CB7C9" opacity="0.55"/>
    <path d="M0 128 C50 112 120 134 180 118 C210 110 232 120 240 116 L240 160 L0 160 Z" fill="#7FA98C" opacity="0.6"/>
    <path d="M0 144 C70 132 120 150 200 138 C220 135 234 140 240 138 L240 160 L0 160 Z" fill="#5F8E6B" opacity="0.7"/>
  </g>
  <!-- a few loose bird strokes -->
  <g fill="none" stroke="#6B5E4A" stroke-width="1.6" stroke-linecap="round" opacity="0.5">
    <path d="M44 46 q6 -6 12 0 q6 -6 12 0"/>
    <path d="M70 60 q5 -5 10 0 q5 -5 10 0"/>
  </g>
</svg>
