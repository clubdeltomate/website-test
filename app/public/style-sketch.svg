  <g stroke="#2E2820" stroke-width="1" opacity="0.55" stroke-linecap="round">
    <line x1="120" y1="120" x2="118" y2="146"/>
    <line x1="128" y1="120" x2="127" y2="146"/>
    <line x1="112" y1="120" x2="111" y2="146"/>
    <line x1="86" y1="38" x2="94" y2="46"/>
    <line x1="156" y1="40" x2="149" y2="49"/>
    <line x1="121" y1="40" x2="120" y2="56"/>
  </g>
</svg>
