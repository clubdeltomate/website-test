<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img" aria-label="Pencil sketch of a potted leafy plant">
  <rect width="240" height="160" fill="#EFE6D0"/>
  <!-- faint paper hatching -->
  <g stroke="#D9CBAA" stroke-width="1" opacity="0.6">
    <line x1="0" y1="130" x2="240" y2="130"/>
    <line x1="0" y1="140" x2="240" y2="140"/>
    <line x1="0" y1="150" x2="240" y2="150"/>
  </g>
  <g fill="none" stroke="#2E2820" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- stems -->
    <path d="M120 118 C118 90 108 70 96 54" fill="none"/>
    <path d="M120 118 C122 92 132 74 146 58" fill="none"/>
    <path d="M120 118 C120 96 120 78 120 60" fill="none"/>
    <!-- leaves -->
