    <path d="M146 58 C164 50 172 36 160 28 C148 22 138 38 146 58 Z" fill="#A6C79E"/>
    <path d="M120 60 C104 52 100 34 114 30 C128 28 132 46 120 60 Z" fill="#7FAE7B"/>
    <path d="M120 60 C136 52 142 36 130 30 C120 27 112 44 120 60 Z" fill="#93BE8D"/>
