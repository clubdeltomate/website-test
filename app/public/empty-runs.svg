<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" fill="none">
  <rect width="480" height="360" fill="#FBF4E6"/>
  <!-- clipboard -->
  <g stroke="#2E2820" stroke-width="5" stroke-linejoin="round">
    <rect x="130" y="70" width="220" height="240" rx="12" fill="#FFFDF6"/>
    <rect x="200" y="52" width="80" height="34" rx="10" fill="#FFC53D"/>
    <circle cx="240" cy="69" r="6" fill="#FFFDF6" stroke-width="4"/>
    <!-- empty checklist -->
    <rect x="160" y="120" width="20" height="20" rx="5" fill="none" stroke-width="4"/>
    <path d="M196 130h120" stroke="#C9BFA9" stroke-width="4"/>
    <rect x="160" y="162" width="20" height="20" rx="5" fill="none" stroke-width="4"/>
    <path d="M196 172h96" stroke="#C9BFA9" stroke-width="4"/>
    <rect x="160" y="204" width="20" height="20" rx="5" fill="none" stroke-width="4"/>
    <path d="M196 214h110" stroke="#C9BFA9" stroke-width="4"/>
  </g>
  <!-- sleeping pencil -->
  <g transform="translate(330 300) rotate(12)" stroke="#2E2820" stroke-width="4" stroke-linejoin="round">
    <rect x="-50" y="-11" width="80" height="22" rx="6" fill="#FFC53D"/>
    <rect x="30" y="-11" width="16" height="22" rx="6" fill="#DE5346"/>
    <path d="M-50-11l-18 11 18 11z" fill="#F4EBD6"/>
    <path d="M-62-3l-6 3 6 3z" fill="#2E2820" stroke="none"/>
    <path d="M6-4q6 5 12 0" stroke-width="2.5" fill="none"/>
  </g>
  <!-- z z z -->
  <g font-family="Caveat, cursive" fill="#2E2820">
    <text x="368" y="230" font-size="30">z</text>
    <text x="386" y="208" font-size="38">z</text>
    <text x="410" y="180" font-size="48">z</text>
  </g>
  <!-- sparkle -->
  <path d="M100 120l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#8566D4"/>
</svg>
