  <g>
    <path d="M480 200l6 15 15 6-15 6-6 15-6-15-15-6 15-6z" fill="#8566D4"/>
    <path d="M900 300l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#8566D4"/>
    <path d="M700 660l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#8566D4"/>
    <path d="M1330 200l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#FFC53D"/>
    <path d="M70 180l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#FFC53D"/>
