  <g transform="rotate(38 92 44)">
    <rect x="84" y="14" width="16" height="44" rx="3" fill="#FFC53D" stroke="#2E2820" stroke-width="3.5"/>
    <rect x="84" y="14" width="16" height="9" rx="3" fill="#DE5346" stroke="#2E2820" stroke-width="3.5"/>
    <path d="M84 58l8 16 8-16z" fill="#F4EBD6" stroke="#2E2820" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M90 66l2 4 2-4z" fill="#2E2820"/>
    <line x1="90" y1="24" x2="90" y2="54" stroke="#2E2820" stroke-width="1.6" opacity=".45"/>
    <line x1="94" y1="24" x2="94" y2="54" stroke="#2E2820" stroke-width="1.6" opacity=".45"/>
  </g>
  <!-- sparkle -->
  <path d="M24 36l2.4 6 6 2.4-6 2.4-2.4 6-2.4-6-6-2.4 6-2.4z" fill="#8566D4"/>
