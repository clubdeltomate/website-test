  <!-- open book -->
  <path d="M22 96c12-6 26-6 38-1v18c-12-5-26-5-38 1z" fill="#FFFDF6" stroke="#2E2820" stroke-width="4" stroke-linejoin="round"/>
  <path d="M106 96c-12-6-26-6-38-1v18c12-5 26-5 38 1z" fill="#FFFDF6" stroke="#2E2820" stroke-width="4" stroke-linejoin="round"/>
  <path d="M30 100c8-3 16-3 24-1M30 106c8-3 16-3 24-1M74 99c8-2 16-2 24 1M74 105c8-2 16-2 24 1"
        stroke="#C9BFA9" stroke-width="2.5" stroke-linecap="round"/>
